<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Gym Log</title>
<style>
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --ink:#111316; --muted:#646B75; --line:#E1E4E8; --soft:#ECEEF1;
  --accent:#C6F432; --accent-ink:#111316; --accent-text:#4E7A00; --accent-soft:#EEF8D0; --done:#E4F4C0;
  --good:#3C8A00; --warn:#A35C00; --bad:#C4321F; --shadow:0 1px 2px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F12; --surface:#1A1C21; --ink:#F2F3F5; --muted:#8B9099; --line:#262930; --soft:#24272E;
  --accent:#C6F432; --accent-ink:#111316; --accent-text:#C6F432; --accent-soft:#2A3516; --done:#22301A;
  --good:#C6F432; --warn:#F0A646; --bad:#FF6B5E; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#1A1C21; --ink:#F2F3F5; --muted:#8B9099; --line:#262930; --soft:#24272E;
  --accent:#C6F432; --accent-ink:#111316; --accent-text:#C6F432; --accent-soft:#2A3516; --done:#22301A;
  --good:#C6F432; --warn:#F0A646; --bad:#FF6B5E; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em} h3{font-size:17px;font-weight:750}
p{margin:.4em 0}
a{color:var(--accent-text)}
.muted{color:var(--muted)}
small{font-size:13px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.top .sub{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:2px}
.sync{display:flex;align-items:center;gap:6px;border:0;background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn);animation:pulse 1s infinite} .sync.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.card{background:var(--surface);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:750;min-height:48px}
.btn.big{white-space:nowrap;width:100%;font-size:18px;min-height:58px;margin-top:14px;border-radius:18px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:8px 14px;min-height:38px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--accent-text);padding:6px 0;font-weight:700}
.seg{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:var(--soft);border-radius:999px;padding:9px 15px;min-height:40px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button.done:not([aria-pressed="true"]){background:var(--done)}
.lab{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.card>summary::after{content:"+";color:var(--muted)}
details.card[open]>summary::after{content:"–"}
details>summary::-webkit-details-marker{display:none}
details>summary{list-style:none}
.card details>summary{cursor:pointer;padding:8px 0}
.card details+details{border-top:1px solid var(--line)}
.pre{white-space:pre-wrap}
.chip{display:inline-flex;align-items:center;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent-text);padding:5px 10px;border-radius:999px;text-transform:uppercase}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--accent);color:var(--accent-ink);vertical-align:middle}
.nm span{display:block}
.nm .then{color:var(--accent-text)}
.wo .title .tag,.nm .tag{display:inline-block;margin-bottom:8px;font-size:12px;letter-spacing:.04em}
.mylog{margin-top:4px;font-size:13px;color:var(--accent-text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pren{margin-top:12px;font-size:14px;font-weight:650;background:var(--soft);border-radius:12px;padding:10px 12px}
.note{margin-top:12px;font-size:14px;border-left:3px solid var(--accent);padding:2px 0 2px 10px;color:var(--muted)}
.empty{text-align:center;padding:28px 18px}
.empty p{color:var(--muted)}
/* Home */
.week{display:flex;gap:6px;margin:4px 0 16px}
.wd{flex:1;min-width:0;height:66px;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:650;color:var(--muted);border:0;padding:0;box-shadow:var(--shadow)}
.wd b{font-size:18px;color:var(--ink)}
.wd i{font-style:normal;font-size:11px;font-weight:800;color:var(--accent-text);min-height:13px}
.wd.done{background:var(--done)}
.wd.today{outline:2px solid var(--accent-text);outline-offset:-2px}
.wd.future b{color:var(--muted)}
.hero{background:linear-gradient(145deg,var(--accent-soft),var(--surface) 75%);padding:20px}
.hero .big{font-size:30px;font-weight:850;letter-spacing:-.02em;margin:10px 0 2px}
.hero .chg{background:none;border:0;color:var(--muted);font-weight:650;font-size:14px;padding:4px 0}
.exl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:12px 14px;margin:0 0 8px;min-height:62px;box-shadow:var(--shadow)}
.exl .n{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.exl.on .n{background:var(--accent);color:var(--accent-ink)}
.exl .t{font-weight:700;line-height:1.25}
.exl .s{font-size:13px;color:var(--muted);margin-top:2px}
.exl .chev{color:var(--muted);font-size:22px}
/* Lists */
.list button.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px;min-height:56px}
.list button.item:last-child{border-bottom:0}
.list .item b{display:block}
.list .item .chev{color:var(--muted);font-size:22px}
.search{width:100%;padding:13px 16px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table.wk{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
table.wk th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:750;padding:4px 6px}
table.wk td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.wk tr.tap{cursor:pointer}
table.wk td.log{white-space:pre-wrap;color:var(--accent-text);font-weight:600}
table.wk td.log.muted{color:var(--muted);font-weight:500}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:4px}
label.f input,label.f textarea,label.f select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
label.f textarea{min-height:76px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:650}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:160px;border:0;background:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted);min-height:60px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent-text)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 15px;max-width:calc(100% - 32px);font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
/* Workout */
.wo{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(8px + env(safe-area-inset-top)) 0 calc(110px + env(safe-area-inset-bottom))}
.wo[hidden]{display:none}
.wo .head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.wo .head b{font-size:15px;color:var(--muted);font-weight:650;text-align:center}
.ib{border:0;background:var(--surface);border-radius:14px;min-width:44px;height:44px;font-size:18px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;box-shadow:var(--shadow)}
.ib svg{width:22px;height:22px}
.wo .title{font-size:27px;font-weight:850;line-height:1.12;letter-spacing:-.02em}
.wo .title span{display:block}
.wo .title .then{color:var(--accent-text)}
.sets{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 4px}
.sets button{width:62px;height:62px;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--muted);padding:0}
.sets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets button.next{border-color:var(--accent);color:var(--ink)}
.wt{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;padding:10px 10px 10px 16px;margin-top:10px;box-shadow:var(--shadow)}
.wt small{display:block;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt .kg{display:flex;align-items:baseline;gap:4px}
.wt input{width:4.6ch;min-width:0;border:0;background:none;font-size:30px;font-weight:850;padding:0;letter-spacing:-.02em}
.wt input::placeholder{color:var(--muted);opacity:.55}
.addkg{display:inline-flex;margin:10px 8px 0 0;border:0;background:var(--soft);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:650;color:var(--muted)}
.wt .u{font-size:18px;font-weight:750;color:var(--muted)}
.wt button{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:0;background:var(--soft);font-size:24px;font-weight:700}
.more{margin-top:12px;background:var(--surface);border-radius:18px;padding:4px 16px;box-shadow:var(--shadow)}
.more>summary{padding:12px 0;font-weight:700;cursor:pointer;color:var(--muted)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:608px;margin:0 auto;display:flex;gap:10px}
.foot .btn{flex:1;margin:0}
.foot .ib{height:58px;min-width:58px;border-radius:18px}
.tmr{background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
.tmr.run{background:var(--done)}
.tmr .row{gap:8px}
.tmr .phase{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tmr .disp{font-size:40px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.tmr.timed .disp{font-size:64px}
.tmr.timed{text-align:center}
.tmr.timed .row{justify-content:center}
.tmr .tbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 2px}
.tmr .tbar i{display:block;height:100%;background:var(--accent);width:0}
.tmr .ctl{display:flex;gap:8px;margin-top:10px}
.tmr .ctl .btn{flex:1;min-height:46px}
.tmr .ctl .ib{height:46px;background:var(--soft);box-shadow:none}
.tmr .modes{flex-wrap:wrap;overflow:visible}
.tmr .params{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tmr.timed .params{justify-content:center}
.step{display:inline-flex;align-items:center;border-radius:12px;overflow:hidden;background:var(--soft)}
.step span{padding:0 8px;font-size:13px;min-width:86px;text-align:center}
.step span b{display:block;font-size:15px}
.step button{border:0;background:none;width:40px;height:46px;font-size:18px;font-weight:700}
/* Workout list view */
.wl{background:var(--surface);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.wl.cur{outline:2px solid var(--accent);outline-offset:-2px}
.wl.shut{cursor:pointer;opacity:.75}
.wl.shut h3{font-size:15px}
.wl.fin{opacity:.55}
.wl h3{font-size:17px}
.src{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
.wn{margin-top:8px}
.item.old,.item.old b,.item.old small{color:var(--muted)}
.pgrp{margin:0 0 10px}.pgrp>summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;background:var(--surface);border-radius:16px;cursor:pointer;box-shadow:var(--shadow)}.pgrp>summary::-webkit-details-marker{display:none}.pgrp>summary::after{content:"›";color:var(--muted);margin-left:8px;transition:transform .2s}.pgrp[open]>summary::after{transform:rotate(90deg)}.pgrp>summary small{margin-left:auto}.pgrp .card{margin-top:6px}.nowdot{color:var(--accent-text);font-size:10px;vertical-align:middle}
.ph{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 4px 6px}.spk{flex:none;margin:0 6px}.spk polyline{fill:none;stroke:var(--accent-text);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.prow .up{color:var(--accent-text);font-size:10px}.prow .dn{color:#d9534f;font-size:10px}
.imp{font-size:13px;padding-left:20px;margin:0 0 10px}.imp li{margin:2px 0}.imp li.two{color:var(--accent-text)}.imp li[data-act]{cursor:pointer;text-decoration:underline dotted}.imp li.one::after{content:" ✓ one move";color:var(--muted)}
.item.old{opacity:.7}
.wn summary{color:var(--accent-text);font-weight:750;cursor:pointer}
.wn textarea{width:100%;min-height:70px;margin-top:8px;border:0;border-radius:12px;background:var(--soft);padding:10px;font:inherit;resize:vertical}
.wl .pos{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.wl h3 .then{color:var(--accent-text)}
.sr{display:grid;grid-template-columns:24px 1fr 50px 42px;align-items:center;gap:8px;height:48px;border-radius:12px;padding:0 4px 0 8px;margin-top:4px}
.sr.hd{height:auto;margin-top:12px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.sr.ok{background:var(--done)}
.sr input{width:100%;height:38px;border:0;border-radius:10px;background:var(--soft);text-align:center;font-weight:750}
.sr .ck{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);font-weight:800;font-size:16px}
.sr.ok .ck{background:var(--accent);color:var(--accent-ink)}
.wl .wt{box-shadow:none;background:var(--soft);padding:6px 6px 6px 12px}
.wl .wt input{font-size:22px}
.foot .tmr .disp{font-size:30px}
.foot .tmr{padding:10px 14px}
.wl .wt button{background:var(--surface);width:42px;height:42px}
/* Chart */
.chart{position:relative;margin-top:10px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent-text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent-text);stroke:var(--surface);stroke-width:2}
.chart .hair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 10px;font-size:13px;max-width:230px;transform:translateX(-50%);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.chart .tip[hidden]{display:none}
.chart .tip b{font-size:15px}
.stats{display:flex;gap:10px;margin-top:12px}
.stats div{flex:1;background:var(--soft);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:20px;font-weight:800}
.hist{margin-top:8px}
.tip .tk{color:var(--accent)}
.hist.one .hc:not(.on){display:none}.hist.one .hr.on{background:var(--accent-soft)}.hist.one .hc{border-top:0}
.hc{border-top:1px solid var(--line);padding:10px 0 4px;font-size:14px}
.hh{margin-bottom:4px}.hh span{color:var(--muted)}.hw{display:block;font-size:12px;color:var(--muted)}
.hr{display:grid;grid-template-columns:48px 1fr;column-gap:8px;padding:5px 6px;margin:0 -6px;border-radius:8px;transition:background .3s}

.hk{font-weight:700;color:var(--accent-text);font-size:13px}
.hx{color:var(--muted);font-size:13px}
.hv,.hn{grid-column:2;white-space:pre-line}.hv{font-weight:600}.hn{color:var(--ink)}.hn i{color:var(--muted);font-size:12px;margin-right:4px}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Gym Log</h1>
  <button type="button" id="syncBtn" class="sync" data-act="tab" data-tab="settings"><i></i><span>Not connected</span></button>
</header>
<main id="view" class="wrap"></main>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Today</button>
  <button type="button" data-act="tab" data-tab="cycles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Programme</button>
  <button type="button" data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>Progress</button>

/* ---------- parsing prescriptions and logs ---------- */

const kgList = (w, m) => String((m ? w.kgs && w.kgs[m] : w.kg) || "").split("/").map((x) => x.trim());

/* ---------- exercise index and history ---------- */
const keyOf = (n) => String(n || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/\bpre-?affaticante\b/g, "").replace(/\bpoi\b/g, "").replace(/[^a-z0-9]+/g, " ").trim();

  [/rematore/g, "row"], [/femorali( gamba singola)?/g, "single leg hamstring curl"], [/(standing )?calf( singolo)?|polpacci/g, "single leg calf raise"],

function groupStats(g) {
  const pts = { kg: [], reps: [], secs: [] };
  for (const it of g.items) {
    const rm = it.mv && it.w.resm && it.w.resm[it.mv] ? Math.max(...repList(it.w, it.mv).map(Number).filter((x) => x > 0)) : null;
    const v = { kg: kgOf(it.w, it.mv), reps: it.mv ? (rm > 0 ? rm : null) : repsOf(it.w), secs: it.mv ? null : secsOf(it.w) };
    for (const m of ["kg", "reps", "secs"]) if (v[m] != null) pts[m].push({ v: v[m], it });
  }
  return pts;
}

}
function progRow(g, now) {

function histGroups(items) {

    const k = it.c.id + "|" + it.d.id + "|" + it.e.name;
    if (!by.has(k)) {
      const w = it.mv ? exParts(it.e).ms.filter((m) => m !== it.mv).map((m) => m.replace(/\s*\(\s*"?pre-?affaticante"?\s*\)/i, "")).join(" + ") : "";
      by.set(k, { c: it.c, d: it.d, with: w, items: [] }); out.push(by.get(k));
    }
    by.get(k).items.push(it);

  for (const h of out) h.items.sort((a, b) => a.w.w - b.w.w);

}

function niceTicks(min, max, n = 4) {

  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}

    hdot.setAttribute("cx", X(i)); hdot.setAttribute("cy", Y(p.v)); hdot.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${esc(fmt(p.v))}</b><br>${esc(cName(p.it.c))} · Day ${esc(p.it.d.id)} · <b class="tk">Wk ${esc(p.it.w.w)}</b><br><span style="opacity:.7">${esc([p.it.w.sets, p.it.w.reps].filter(Boolean).join(" × "))}</span>`;
    if (onPick) onPick(p.it);
    if (onPick) return; // the history below shows the picked week instead of a tooltip
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(X(i), 110), W - 110) + "px";
    tip.style.top = Math.max(0, Y(p.v) - tip.offsetHeight - 14) + "px";
  };
  svg.addEventListener("pointermove", (e) => { if (onPick && e.pointerType === "mouse" && !e.buttons) return; show(e.clientX); });
  svg.addEventListener("pointerdown", (e) => show(e.clientX, e.clientY));
  svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !onPick) hide(); });
  svg.addEventListener("clearpick", () => { hide(); if (onPick) onPick(null); });
}

// Tabata and EMOM blocks: one row per round, the moves taking turns ("6'" of 20" on / 10" off = 12 rounds).
function block(e, w) {
  const nm = e.name + " " + (e.desc || ""), total = parseTime(w.sets);
  // Numbered lines keep repeats (EMOM "1) One arm thruster / 2) One arm thruster" = one per arm).
  const numbered = nameLines(e.name).filter((l) => /^\d+\s*\)/.test(l)).map((l) => l.replace(/^\d+\s*\)\s*/, "").replace(/\*+/g, "").trim());
  const mvs = numbered.length ? numbered : moves(e.name);

    return { kind: "tabata", mvs, rounds, plan: `${rounds} rounds · ${on}s work, ${off}s rest · max reps`, target: () => "" };
  }

  }

}

  return wo.sets[ei];
}
const ltHtml = (lt, style = "") => (lt ? `<p class="muted" style="font-size:13px;margin:10px 2px 0;${style}"><b>Last time</b>${lt.other ? ` (${esc(lt.other.toLowerCase())})` : ""} · ${esc(lt.label)}<br>${esc(logText(lt.w).slice(0, 160))}</p>` : "");
// One big weight box per move, with −/+ in 2.5 kg steps; the placeholder is last time's weight.
const LOADED_RE = /manubr|sovracc|disc|kettle|dumb|bilanc|pes[oi]|weight|thruster|snatch|goblet|rdl|press|curl|rematore|row|stacc|swing|croci|alzate|affondi|squat|step up|hip thrust|ponte|kick ?back|lento|spinte|turkish|clean/i;

let ac = null;

const T = { mode: "rest", secs: 60, work: 20, rest: 10, rounds: 8, period: 60, running: false, startAt: 0, acc: 0, iv: null, beeped: "", finished: false };

function timerDefaults() {
  T.finished = false; T.acc = 0; T.beeped = "";

  const { list } = woExercises();
  const item = list[wo.step - 1];
  if (!item) { T.mode = "count"; T.secs = T.secs || 60; return; }
  const { e } = item, w = e.weeks[wo.k];
  const nm = e.name + " " + (e.desc || "");
  if (/tabata/i.test(nm)) {

    const mins = parseTime(w.sets); T.rounds = mins ? Math.max(1, Math.round(mins / (T.work + T.rest))) : 8;
  } else if (/emom/i.test(nm)) {

  } else if (/minor tempo|for time|fammi sapere il tempo|\d+\/\d+\s*[–-]\s*\d+\/\d+/i.test(nm)) {

}
function segments() {

  if (T.mode === "emom") return Array.from({ length: T.rounds }, (_, i) => ({ label: `Minute ${i + 1}/${T.rounds}`, secs: T.period, kind: "work" }));

      return { disp: fmtClock(left), left, label: segs[i].label, frac: el / total, kind: segs[i].kind, done: false, segIdx: i };
    }

function shareText(c, k) {
  const weeks = k >= 0 ? [k] : Array.from({ length: weekCount(c) }, (_, j) => j);
  const out = [`${cName(c)}${k >= 0 ? ` · week ${weekLabel(c, k)}` : ""}`];
  for (const d of c.days) {
    const lines = [];
    for (const e of d.exercises) {
      const rows = weeks.map((j) => e.weeks[j] && { j, w: e.weeks[j] }).filter((x) => x && logText(x.w));
      if (!rows.length) continue;
      lines.push("• " + (moves(e.name).join(" + ") || e.name));
      for (const { w } of rows) {
        const pre = weeks.length > 1 ? `  wk ${w.w}: ` : "  ";
        if (logText(w)) lines.push(pre + logText(w));
      }
    }
    if (lines.length) out.push("", `Day ${d.id}`, ...lines);

      if (!d.cooldown) d.cooldown = od.cooldown;
    });
    data.cycles = data.cycles.map((x) => (x.id === c.id ? c : x));
  } else {
    if (!c.days.some((d) => d.cooldown)) { const prev = currentCycle(); c.days.forEach((d, i) => (d.cooldown = (prev && prev.days[i] && prev.days[i].cooldown) || "")); }
    c.order = Math.max(-1, ...data.cycles.map((x) => x.order ?? 0)) + 1;
    data.cycles.push(c);
  }
  data.current = c.id; ui.sel = null; pending = null;
  save(); closeSheet(); ui.tab = "train"; saveUI(); render();
  toast(`${c.label} saved`);
}
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type: blob.type });

    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
// For the trainer: one line per set ("Set 2: Floor press 12,5 kg + Push ups bodyweight · 10 reps"); 0 kg or empty = bodyweight.
function setLines(w, e) {
  const bk = e && block(e, w);
  const mv = e && !bk ? moves(e.name) : [];
  const kg = (mv.length > 1 ? mv : [null]).map((m) => [m, kgList(w, m)]);
  const reps = /^[\d\s,]+$/.test(w.res || "") ? w.res.split(",").map((x) => x.trim()) : [];
  const rm = mv.length > 1 && hasResm(w) ? Object.fromEntries(mv.map((m) => [m, repList(w, m)])) : null;
  const n = Math.max(reps.length, ...kg.map(([, a]) => (a.some(Boolean) ? a.length : 0)), ...(rm ? Object.values(rm).map((a) => (a.some(Boolean) ? a.length : 0)) : []));
  if (n < 2) return "";
  return Array.from({ length: n }, (_, j) => {
    if (bk && bk.kind !== "time") return `Round ${j + 1}: ${bk.mvs[j % bk.mvs.length]}${reps[j] ? ` · ${reps[j]} reps` : ""}`;
    const k = kg.map(([m, a]) => { const t = parseFloat(String(a[j] || "").replace(",", ".")) > 0 ? `${a[j]} kg` : "bodyweight"; return (m ? `${m} ${t}` : t) + (rm && rm[m][j] ? ` × ${rm[m][j]}` : ""); }).join(" + ");
    return `Set ${j + 1}: ${[k, reps[j] && `${reps[j]} reps`].filter(Boolean).join(" · ")}`;
  }).join("\n");
}
async function exportExcel(only) {
  try {
    const X = await loadXLSX();
    const wb = X.utils.book_new(), used = new Set();
    for (const c of only ? [only] : byOrder()) {
      const W = 6, nd = c.days.length, aoa = [];
      const row = () => new Array(nd * W).fill("");
      let r = row(); r[0] = "Durata: " + (c.duration || ""); aoa.push(r);
      r = row(); r[0] = "Periodo: " + (c.period || c.when || ""); aoa.push(r);
      r = row(); c.days.forEach((d, i) => (r[i * W] = `GIORNO "${d.id}"`)); aoa.push(r);
      r = row(); c.days.forEach((d, i) => (r[i * W] = "Riscaldamento:\n" + (d.warmup || ""))); aoa.push(r);
      r = row(); c.days.forEach((d, i) => ["ESERCIZIO", "SETTIMANA DI ALLENAMENTO", "SERIE", "RIPETIZIONI", "REC TRA LE SERIE", "NOTE"].forEach((h, k) => (r[i * W + k] = h))); aoa.push(r);
      const cols = c.days.map((d) => d.exercises.flatMap((e) => e.weeks.map((w, k) => [k ? "" : nameLines(e.name).join("\n") + (e.desc ? "\n\n" + e.desc : ""), w.w, w.sets, w.reps, w.rest, (isOld(c) ? [w.log && "Old notes: " + w.log] : [setLines(w, e) || logParts(w).filter(Boolean).join(" · "), w.log]).filter(Boolean).join("\n")])));
      const n = Math.max(0, ...cols.map((l) => l.length));
      for (let i = 0; i < n; i++) { r = row(); cols.forEach((l, di) => l[i] && l[i].forEach((v, k) => (r[di * W + k] = v))); aoa.push(r); }
      r = row(); c.days.forEach((d, i) => (r[i * W] = d.cooldown || "")); aoa.push(r);
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = c.days.flatMap(() => [{ wch: 36 }, { wch: 8 }, { wch: 14 }, { wch: 16 }, { wch: 10 }, { wch: 36 }]);
      let name = ((isOld(c) ? "(old) " : "") + (c.title || [c.label, c.when && `(${c.when})`].filter(Boolean).join(" "))).replace(/[\[\]:*?/\\]/g, " ").replace(/\s+/g, " ").trim().slice(0, 31);
      for (let k = 2; used.has(name); k++) name = name.slice(0, 27) + " " + k;
      used.add(name);
      X.utils.book_append_sheet(wb, ws, name);
    }
    const out = X.write(wb, { bookType: "xlsx", type: "array" });
    await shareOrDownload(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), only ? `${only.label.replace(/[^\w-]+/g, "-")}-${stamp()}.xlsx` : `gym-log-${stamp()}.xlsx`);
  } catch (e) { toast("Excel export failed: " + e.message, 5000); }
}
function exportJSON() { shareOrDownload(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), `gym-log-backup-${stamp()}.json`); }
async function restoreJSON(file) {
  try {
    const doc = JSON.parse(await file.text());
    if (!doc || !Array.isArray(doc.cycles)) throw new Error("not a Gym Log backup");
    data = merge(data, doc); save(); render(); toast(`Restored: ${live().length} cycles`);
  } catch (e) { toast("Couldn't restore: " + e.message, 5000); }
}

/* ---------- sync with the private GitHub repo ---------- */
function merge(a, b) {
  const out = { version: 1, updated: Math.max(a.updated || 0, b.updated || 0), current: (b.updated || 0) > (a.updated || 0) ? b.current : a.current, cycles: [] };
  const am = new Map(a.cycles.map((c) => [c.id, c])), bm = new Map(b.cycles.map((c) => [c.id, c]));
  for (const id of new Set([...am.keys(), ...bm.keys()])) {
    const x = am.get(id), y = bm.get(id);
    if (!x || !y) { out.cycles.push(JSON.parse(JSON.stringify(x || y))); continue; }
    const newer = (y.at || 0) > (x.at || 0) ? y : x, older = newer === x ? y : x;
    const c = JSON.parse(JSON.stringify(newer));
    if (!c.deleted) c.days.forEach((d, di) => d.exercises.forEach((e, ei) => e.weeks.forEach((w, k) => {
      const ow = older.days[di] && older.days[di].exercises[ei] && older.days[di].exercises[ei].weeks[k];
      if (ow && (ow.at || 0) > (w.at || 0)) LOGF.forEach((f) => { w[f] = ow[f]; });
    })));
    out.cycles.push(c);
  }
  return out;
}
const API = "https://api.github.com";
function b64enc(str) { const u = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(b64) { const s = atob(b64.replace(/\s/g, "")); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new TextDecoder().decode(u); }
function gh(path, opts = {}) {
  return fetch(API + path, { ...opts, cache: "no-store", headers: { Authorization: "Bearer " + settings.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
}
function ghError(status) {
  if (status === 401) return "access key not accepted (expired or mistyped)";
  if (status === 403) return "access key lacks permission for the repo";
  if (status === 404) return "repo not found for this key";
  return "GitHub error " + status;
}
async function pullRemote() {
  const r = await gh(`/repos/${settings.repo}/contents/${settings.path}`);
  if (r.status === 404) {
    const rr = await gh(`/repos/${settings.repo}`);
    if (!rr.ok) throw new Error(ghError(rr.status));
    return { doc: null, sha: null };
  }
  if (!r.ok) throw new Error(ghError(r.status));
  const j = await r.json();
  let text = j.content ? b64dec(j.content) : "";
  if (!text) { const r2 = await gh(`/repos/${settings.repo}/git/blobs/${j.sha}`); if (!r2.ok) throw new Error(ghError(r2.status)); text = b64dec((await r2.json()).content); }
  return { doc: JSON.parse(text), sha: j.sha };
}
async function pushRemote() {
  const who = { name: "lross46", email: "347590180+lross46@users.noreply.github.com" };
  const body = { message: "Update training log", content: b64enc(JSON.stringify(data, null, 1)), author: who, committer: who };
  if (sha) body.sha = sha;
  const r = await gh(`/repos/${settings.repo}/contents/${settings.path}`, { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
  if (r.status === 409 || r.status === 422) return false;
  if (!r.ok) throw new Error(ghError(r.status));
  sha = (await r.json()).content.sha; LS.set("gym.sha", sha);

}
let syncing = false, again = false, syncTimer = null, syncStatus = { s: "off", msg: "", at: LS.get("gym.syncedAt", 0) };
function syncText() {
  if (!settings.token) return "Not connected: your log is saved on this phone only.";
  if (syncStatus.s === "err") return "Last sync failed: " + syncStatus.msg + ". Your changes are safe on this phone.";
  if (syncStatus.s === "offline") return "Offline: changes are saved on this phone and will sync later.";
  return syncStatus.at ? "Last synced " + new Date(syncStatus.at).toLocaleString() + "." : "Not synced yet.";
}
function setSync(s, msg = "") {
  syncStatus.s = s; syncStatus.msg = msg;
  if (s === "ok") { syncStatus.at = Date.now(); LS.set("gym.syncedAt", syncStatus.at); }
  const b = $("#syncBtn");
  b.className = "sync " + ({ ok: "ok", busy: "busy", err: "err", offline: "err" }[s] || "");
  b.querySelector("span").textContent = { off: "Not connected", busy: "Syncing…", ok: dirty ? "Saved on phone" : "Synced", err: "Sync problem", offline: "Offline" }[s];
  const i = $("#syncInfo"); if (i) i.textContent = syncText();
}
function scheduleSync(ms = 20000) { clearTimeout(syncTimer); if (settings.token) { syncTimer = setTimeout(sync, ms); setSync(syncStatus.s === "busy" ? "busy" : syncStatus.s === "off" ? "ok" : syncStatus.s); } }

async function sync() {

  syncing = true; setSync("busy");
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const { doc, sha: rsha } = await pullRemote();
      if (doc && rsha !== sha) { data = merge(data, doc); LS.set("gym.data", data); index = null; }
      sha = rsha; LS.set("gym.sha", sha);
      if (!dirty && doc) break;
      if (await pushRemote()) { dirty = false; LS.set("gym.dirty", false); break; }
    }
    setSync("ok");
    if (!wo) render();
  } catch (e) {

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushSync();
  else { if (wo) keepAwake(); if (settings.token && !syncing) sync(); if (T.running) timerTick(); }
});
window.addEventListener("online", () => flushSync());

/* ---------- theme ---------- */
function applyTheme() { const t = LS.get("gym.theme", "auto"); if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, D = el.dataset;
  const num = (k) => +D[k];
  switch (a) {
    case "tab": ui.tab = D.tab; if (D.tab === "cycles") ui.cycle = null; saveUI(); render(); window.scrollTo(0, 0); break;
    case "selday": ui.sel.di = num("i"); saveUI(); render(); openPick(); break;
    case "selweek": ui.sel.k = num("k"); saveUI(); render(); openPick(); break;
    case "start": startWorkout(); break;
    case "start-at": { startWorkout(); if (!wo) break; wo.step = num("i"); timerDefaults(); renderWo(); const cur = $("#wo .wl.cur"); if (cur) $("#wo").scrollTop = Math.max(0, cur.offsetTop - 70); break; }
    case "log": openLog(D.cid, num("di"), num("ei"), num("k")); break;
    case "savelog": saveLog(D.cid, num("di"), num("ei"), num("k")); break;
    case "close": closeSheet(); break;
    case "cycle": ui.tab = "cycles"; ui.cycle = D.id; ui.cday = 0; saveUI(); render(); window.scrollTo(0, 0); break;
    case "cycles-back": ui.cycle = null; saveUI(); render(); break;
    case "cday": ui.cday = num("i"); saveUI(); render(); break;
    case "setcur": data.current = D.id; ui.sel = null; save(); render(); toast("Current cycle changed"); break;
    case "train-cycle": data.current = D.id; ui.sel = null; save(); ui.tab = "train"; saveUI(); render(); break;
    case "delcycle": {
      const c = findCycle(D.id);
      if (c && confirm(`Delete ${c.label} and everything logged in it? This also removes it from your synced data.`)) {
        c.deleted = true; c.at = Date.now(); if (data.current === c.id) data.current = null;
        ui.cycle = null; ui.sel = null; save(); render();
      }
      break;
    }
    case "import": $("#fImport").click(); break;
    case "import-save": importSave(); break;
    case "one": { const e = pending && pending.days[+el.dataset.d].exercises[+el.dataset.e]; if (e) { e.one = !e.one; oneVer++; showImport(); } break; }
    case "prog": ui.prog = D.key; ui.metric = null; ui.variant = "All"; saveUI(); render(); window.scrollTo(0, 0); break;
    case "prog-back": ui.prog = null; saveUI(); render(); break;
    case "hist-all": { const svg = $("#chart svg"); if (svg) svg.dispatchEvent(new Event("clearpick")); break; }
    case "metric": ui.metric = D.m; saveUI(); render(); break;
    case "variant": ui.variant = D.v; saveUI(); render(); break;
    case "savesettings":
      settings.token = $("#sToken").value.trim();
      settings.repo = ($("#sRepo").value.trim() || DEFAULTS.repo).replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
      settings.path = $("#sPath").value.trim() || DEFAULTS.path;
      LS.set("gym.settings", settings); sha = null; LS.set("gym.sha", null);
      sync().then(() => { if (syncStatus.s === "ok") toast("Connected and synced"); else toast(syncText(), 5000); });
      break;
    case "excel": exportExcel(); break;
    case "excel-cycle": exportExcel(findCycle(D.id)); break;
    case "share": ev.preventDefault(); openShare(D.id, num("k")); break;
    case "share-send": shareSend(); break;
    case "share-wa": ev.preventDefault(); shareSend("wa"); break;
    case "share-mail": ev.preventDefault(); shareSend("mail"); break;
    case "share-copy": ev.preventDefault(); shareSend("copy"); break;
    case "json": exportJSON(); break;
    case "restore": $("#fRestore").click(); break;
    case "theme": LS.set("gym.theme", D.t); applyTheme(); render(); break;
    case "reset-day": {
      // Clears everything logged for one day and week (taps made by mistake); a fresh "at" makes the reset win when syncing.
      const c = findCycle(D.id), d = c && c.days[num("di")], k = num("k");
      if (!d || !confirm(`Reset ${c.label} · Day ${d.id} · Week ${weekLabel(c, k)}? This clears the ticks, kg, reps and notes of that day.`)) break;
      const now = Date.now();
      d.exercises.forEach((e) => { const w = e.weeks[k]; if (!w) return; LOGF.forEach((f) => delete w[f]); w.at = now; });
      if (wo && wo.cid === c.id && wo.di === num("di") && wo.k === k) { wo.sets = {}; wo.step = 1; save(); renderWo(); $("#wo").scrollTop = 0; }
      else { save(); render(); }
      toast("Day reset");
      break;
    }
    case "wo-close": if (confirm("Leave the workout? What you've logged is saved.")) endWorkout(); break;
    case "wo-go": {
      const n = woExercises().list.length;
      wo.step = Math.max(1, Math.min(n, num("i")));
      if (!T.running || T.mode === "rest") { timerStop(true); timerDefaults(); }
      renderWo();
      const cur = $("#wo .wl.cur"); if (cur) $("#wo").scrollTop = Math.max(0, cur.offsetTop - 70);
      if (dirty) scheduleSync();
      break;
    }
    case "wo-finish": {
      const { list } = woExercises();
      list.forEach(({ e }) => { const w = e.weeks[wo.k]; if (!w.done) markDone(w); });

    }

      const { list } = woExercises(); const item = list.find((x) => x.ei === ei); if (!item) break;
      const w = item.e.weeks[wo.k], target = setCount(item.e, w), bk = block(item.e, w);
      const before = setsDone(ei, w, item.e);
      wo.sets[ei] = i < before ? i : i + 1;
      // Ticking a set with an empty weight box keeps the suggested weight.
      if (i >= before) {
        const lt = lastTime(findCycle(wo.cid), item.e, wo.k);
        for (const m of bk ? [] : kgCols(item.e, w, lt)) {
          const a = kgList(w, m);
          if (a[i]) continue;
          while (a.length <= i) a.push("");

        }
        // Reps not typed take the programme's number (Luca can still edit them).

        const fill = (a, v) => { if (a[i] || !v) return null; while (a.length <= i) a.push(""); a[i] = v; return a.join(",").replace(/,+$/, ""); };
        if (cols.length > 1) for (const m of cols) { const v = fill(repList(w, m), repTarget(item.e, w, m)); if (v) w.resm = Object.assign({}, w.resm, { [m]: v }); }
        else if (!bk && (!w.res || /^[\d\s,]+$/.test(w.res))) { const v = fill(repList(w, null), (String(w.reps || "").match(/^\s*(\d+)/) || [])[1]); if (v) w.res = v; }
      }

      wo.step = list.indexOf(item) + 1;
      const ticked = wo.sets[ei] > before, rest = bk ? null : parseTime(w.rest);
      const y = $("#wo").scrollTop;
      if (ticked && rest) { T.restore = T.mode !== "rest" && wo.sets[ei] < target; T.mode = "rest"; T.secs = rest; timerStop(true); }
      renderWo(); $("#wo").scrollTop = y;
      if (ticked && rest) timerStart();
      if (ticked && wo.sets[ei] >= target) toast("All sets done 💪");
      break;
    }
    case "kg-adj": {
      const inp = el.closest(".wt").querySelector("input");
      const base = parseFloat(String(inp.value || inp.placeholder || "0").replace(",", ".")) || 0;
      inp.value = String(Math.max(0, Math.round((base + +D.d) * 100) / 100));
      inp.dispatchEvent(new Event("input", { bubbles: true }));
      break;
    }
    case "kg-open": { (wo.kgOpen = wo.kgOpen || {})[D.k] = true; const y = $("#wo").scrollTop; renderWo(); $("#wo").scrollTop = y; break; }
    case "t-cfg": T.cfg = !T.cfg; renderTimer(); break;
    case "pick": openPick(); break;
    case "t-mode": T.mode = D.m; timerStop(true); if ((T.mode === "rest" || T.mode === "count") && !T.secs) T.secs = 60; renderTimer(); break;
    case "t-adj": { const k = D.k, d = +D.d; const min = k === "rounds" ? 1 : k === "rest" ? 0 : 5; T[k] = Math.max(min, Math.min(k === "rounds" ? 99 : 3600, (T[k] || 0) + d)); renderTimer(); break; }
    case "t-start": if (T.running) timerPause(); else timerStart(); break;
    case "t-reset": timerStop(); break;
  }
});
$("#fImport").addEventListener("change", (e) => { const f = Array.from(e.target.files); e.target.value = ""; onImport(f); });
$("#fRestore").addEventListener("change", (e) => { if (e.target.files[0]) restoreJSON(e.target.files[0]); e.target.value = ""; });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === "progress" && ui.prog && !wo) render(); }, 200); });

/* ---------- start ---------- */
ui.sel = null; // each launch opens on the next session not yet done, not the last one browsed

render();
setSync(settings.token ? "ok" : "off");
if (settings.token) sync();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // Reload once when a new version takes over, but not on the very first install.
